name: testing cache
on: 
    push:

jobs:
    get-data:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - uses: actions/cache@v4    
              id: cache-data
              with: 
                key: data
                path: data.txt
            - run: echo ${{ steps.cache-data.outputs.cache-hit }}
            - name: get data
                if: steps.cache-data.outputs.cache-hit != 'true'
                - run: node getData.js
